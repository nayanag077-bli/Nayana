<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nayana | My Profile</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0f;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .profile-card {
      width: 100%;
      max-width: 850px;
      background: #15151c;
      border: 1px solid #2b2b36;
      border-radius: 24px;
      padding: 45px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .profile-icon {
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      font-size: 42px;
      font-weight: bold;
      color: white;
      box-shadow: 0 0 30px rgba(139, 92, 246, 0.35);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #a78bfa, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: #aaaab5;
      font-size: 17px;
    }

    .intro {
      text-align: center;
      color: #c7c7d1;
      line-height: 1.8;
      margin-bottom: 35px;
    }

    .section-title {
      font-size: 22px;
      margin-bottom: 18px;
      color: #ffffff;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      margin-bottom: 35px;
    }

    .info-box {
      background: #1d1d26;
      border: 1px solid #30303b;
      padding: 22px;
      border-radius: 16px;
      transition: 0.3s ease;
    }

    .info-box:hover {
      transform: translateY(-5px);
      border-color: #8b5cf6;
      box-shadow: 0 10px 30px rgba(139, 92, 246, 0.12);
    }

    .info-box span {
      display: block;
      color: #9999a6;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .info-box strong {
      color: #ffffff;
      font-size: 17px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 35px;
    }

    .tag {
      padding: 11px 18px;
      border-radius: 30px;
      background: #242430;
      border: 1px solid #393947;
      color: #dddde8;
      transition: 0.3s;
    }

    .tag:hover {
      background: #8b5cf6;
      border-color: #8b5cf6;
      color: white;
      transform: scale(1.05);
    }

    .travel {
      background: linear-gradient(
        135deg,
        rgba(139, 92, 246, 0.15),
        rgba(236, 72, 153, 0.08)
      );
      border: 1px solid #393047;
      border-radius: 18px;
      padding: 25px;
      text-align: center;
    }

    .travel-icon {
      font-size: 35px;
      margin-bottom: 10px;
    }

    .travel p {
      color: #bdbdc9;
      line-height: 1.7;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      color: #777784;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      body {
        padding: 15px;
      }

      .profile-card {
        padding: 28px 20px;
      }

      h1 {
        font-size: 34px;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="profile-card">

    <header class="header">
      <div class="profile-icon">N</div>

      <h1>Nayana</h1>

      <p class="subtitle">

      </p>
    </header>

    <p class="intro">
      Hello! I'm <strong>Nayana</strong>, a student at
      <strong>Jain Institute of Technology</strong>.
      I enjoy singing, watching movies, exploring new places,
      and of course, enjoying delicious food! ✨
    </p>

      </div>

      <div class="info-box">
        <span>College</span>
        <strong>Jain Institute of Technology</strong>
      </div>
    </div>

    <h2 class="section-title">🍴 Favorite Foods</h2>
